[package]
name = "pspm-rotation"
version = "0.1.0"
edition = "2021"

[dependencies]
pspm-core = { path = "../pspm-core" }
pspm-generator = { path = "../pspm-generator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
