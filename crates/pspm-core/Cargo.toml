[package]
name = "pspm-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlcipher = { version = "0.31", package = "rusqlite", features = ["bundled"] }
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
regex-lite = "0.1"
