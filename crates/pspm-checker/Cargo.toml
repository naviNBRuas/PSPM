[package]
name = "pspm-checker"
version = "0.1.0"
edition = "2021"

[dependencies]
pspm-core = { path = "../pspm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
