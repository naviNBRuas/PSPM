[package]
name = "pspm-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
pspm-core = { path = "../pspm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
