[package]
name = "pspm-export"
version = "0.1.0"
edition = "2021"

[dependencies]
pspm-core = { path = "../pspm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
